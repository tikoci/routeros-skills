name: Dependency Review

# Gates new/changed dependencies on PRs. This repo only carries dev-time lint
# tooling (cspell, markdownlint-cli2), but those still pull a transitive tree —
# this catches a known-vulnerable or badly-licensed package before it lands.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
